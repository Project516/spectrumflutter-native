name: apple_ai
description: "Apple's on-device foundation model (Apple Intelligence) as a Flutter text generator."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      # One Swift source tree under darwin/ serves both, because the plugin is
      # the same code on either OS: FoundationModels is not a UIKit or AppKit
      # API.
      ios:
        pluginClass: AppleAiPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: AppleAiPlugin
        sharedDarwinSource: true
