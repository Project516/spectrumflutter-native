name: liquid_glass
description: "Apple Liquid Glass (iOS 26, macOS 26) as a Flutter platform view."
version: 0.6.0
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      # One Swift source tree under darwin/ serves both: the UIKit and AppKit
      # halves are `#if os(...)` branches of the same file.
      ios:
        pluginClass: LiquidGlassPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: LiquidGlassPlugin
        sharedDarwinSource: true
