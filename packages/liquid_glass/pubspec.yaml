name: liquid_glass
description: "iOS 26 Liquid Glass (UIGlassEffect) as a Flutter platform view."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LiquidGlassPlugin
